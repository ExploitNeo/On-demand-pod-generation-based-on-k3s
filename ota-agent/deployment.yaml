apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-spawner-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-spawner-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-spawner-binding
subjects:
  - kind: ServiceAccount
    name: pod-spawner-sa
    namespace: default
roleRef:
  kind: Role
  name: pod-spawner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-spawner-deployment
  labels:
    app: pod-spawner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-spawner
  template:
    metadata:
      labels:
        app: pod-spawner
    spec:
      serviceAccountName: pod-spawner-sa
      containers:
        - name: spawner
          image: localhost/ota-spawner:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4321     # ← Go 코드에 맞춤
          env:
            - name: CHALLENGE_IMAGE
              value: localhost/ota-agent:latest # ← spawner가 동적 생성할 이미지
---
apiVersion: v1
kind: Service
metadata:
  name: pod-spawner-service
  labels:
    app: pod-spawner
spec:
  type: NodePort
  selector:
    app: pod-spawner
  ports:
    - protocol: TCP
      port: 4321           # 클러스터 내부 포트
      targetPort: 4321     # 컨테이너 포트
      nodePort: 31321      # 노드 외부에서 접속할 포트(범위 30000~32767)

